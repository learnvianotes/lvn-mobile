# Home tab (P6h, ADR-0076): a greeting, today's ring and the week from Rhythm, the next exam (or a way to add one), and
# recommendations that say why; the search bar, Q&A and the avatar open their screens, the cards Exams and Rhythm.
appId: ${APP_ID}
env:
  APP_ID: com.learnvianotes.dev
---
- runFlow: subflows/signed-in.yaml
- assertVisible: "Keep learning, .*"
# No dead controls on Home (ADR-0076): the search bar opens Explore, Q&A opens Ask AI, the avatar the Profile tab.
- tapOn: "Search notes, topics and people"
- extendedWaitUntil:
    visible: "Explore"
    timeout: 15000
- tapOn: "Home"
- tapOn: "Q&A"
- extendedWaitUntil:
    visible: "Ask AI"
    timeout: 15000
- pressKey: Back
- tapOn: "Your profile"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000
- tapOn: "Home"
- scrollUntilVisible:
    element: "Your rhythm"
    direction: DOWN
- extendedWaitUntil:
    visible: "10 learning minutes or 10 reviews and today counts"
    timeout: 15000
- assertVisible: "Today’s ring: 0% of the way to a counted day"
- scrollUntilVisible:
    element: "Add an exam"
    direction: DOWN
- tapOn: "Add an exam"
- extendedWaitUntil:
    visible: "Exams"
    timeout: 15000
- pressKey: Back
# A weekly contest's card (when one is open) sits above the recommendations.
- scrollUntilVisible:
    element: ".*suggestions appear here."
    direction: DOWN
- scrollUntilVisible:
    element: "This week"
    direction: UP
- tapOn: "This week"
- extendedWaitUntil:
    visible: "Your planned days|This week"
    timeout: 15000

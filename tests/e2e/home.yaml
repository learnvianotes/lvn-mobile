# Home tab (P6h): a greeting, today's ring and the week from Rhythm, the next exam (or a way to add one), and
# recommendations that say why; the cards open Exams and Rhythm.
appId: ${APP_ID}
env:
  APP_ID: com.learnvianotes.dev
---
- runFlow: subflows/signed-in.yaml
- assertVisible: "Keep learning, .*"
- scrollUntilVisible:
    element: "Your rhythm"
    direction: DOWN
- extendedWaitUntil:
    visible: "10 learning minutes or 10 reviews and today counts"
    timeout: 15000
- assertVisible: "Today’s ring: 0% of the way to a counted day"
- scrollUntilVisible:
    element: "Add an exam"
    direction: DOWN
- tapOn: "Add an exam"
- extendedWaitUntil:
    visible: "Exams"
    timeout: 15000
- pressKey: Back
- scrollUntilVisible:
    element: "Recommended for you"
    direction: DOWN
- assertVisible: ".*suggestions appear here."
- tapOn: "This week"
- extendedWaitUntil:
    visible: "Your planned days|This week"
    timeout: 15000

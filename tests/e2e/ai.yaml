# AI on the phone against the real model (lvn-backend ADR-0058, ADR-0059, ADR-0060): a question about a note is
# answered with the note as its source; its AI tasks summarise it, make flashcards, and the chosen cards go into the
# note, which reaches the server. Needs a server whose AI answers (the local environment's API asks the dev machine's
# Ollama); without it this flow does nothing.
appId: ${APP_ID}
env:
  APP_ID: com.learnvianotes.dev
---
- runFlow: subflows/signed-in.yaml
- runScript:
    file: scripts/ai-note.js
    env:
      TOKEN: ${output.token}
- runFlow:
    when:
      true: ${output.ai === 'on'}
    commands:
      - tapOn: "Notes"
      # The note was made after the app's first sync: pull to refresh.
      - retry:
          maxRetries: 3
          commands:
            - swipe:
                start: "50%, 30%"
                end: "50%, 75%"
            - extendedWaitUntil:
                visible: "Heaps"
                timeout: 10000
      - tapOn: "Heaps"
      - tapOn: "Nova tasks"
      # Ask Nova about this note (ADR-0060): the draft is the source, cited by number.
      - tapOn: "Ask about this note"
      - inputText: "What does a min-heap keep at the root?"
      - hideKeyboard
      - tapOn: "Ask"
      - extendedWaitUntil:
          visible: "Source 1: Heaps"
          timeout: 120000
      - tapOn: "Summarise"
      # The model takes seconds on the dev machine's GPU; the first answer also loads it.
      - scrollUntilVisible:
          element: "Share this result"
          direction: DOWN
          timeout: 120000
      - scrollUntilVisible:
          element: "Flashcards"
          direction: UP
      - tapOn: "Flashcards"
      # The cards end with their Add button: wait for it, then go back up to the first card (scrolling down to a small
      # checkbox can pass it when the model answers fast).
      - scrollUntilVisible:
          element: "Add .* to this note"
          direction: DOWN
          timeout: 120000
      - scrollUntilVisible:
          element: "Keep card 1"
          direction: UP
      # Drop the first card; the rest go into the note. The button is brought to the middle of the screen: at the bottom
      # edge, beside the gesture bar, a tap can miss it.
      - tapOn: "Keep card 1"
      - scrollUntilVisible:
          element: "Add .* to this note"
          direction: DOWN
          centerElement: true
      - tapOn: "Add .* to this note"
      - scrollUntilVisible:
          element: "Added to this note."
          direction: DOWN
          timeout: 30000
      - runScript:
          file: scripts/server-notes.js
          env:
            TOKEN: ${output.token}
      - assertTrue: ${output.cards.indexOf('"front"') >= 0}
      - tapOn: "Back"
      - assertVisible: "Binary heaps"

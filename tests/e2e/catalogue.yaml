# The resource catalogue on the phone (lvn-backend ADR-0075): a verified learner finds an approved course by its words
# from the Profile tab, saves it, and finds it in their Saved list. scripts/e2e-android.mjs makes the learner and
# the approved resource when run with --vm; without it this flow does nothing.
appId: ${APP_ID}
env:
  APP_ID: com.learnvianotes.dev
---
- runFlow:
    when:
      true: ${typeof RESOURCE_TITLE !== 'undefined' && RESOURCE_TITLE !== ''}
    commands:
      - launchApp:
          clearState: true
      - tapOn:
          id: "welcome-sign-in"
      - tapOn:
          id: "sign-in-email"
      - inputText: ${COMMUNITY_EMAIL}
      - tapOn:
          id: "sign-in-mode"
      - tapOn:
          id: "sign-in-password"
      - inputText: ${COMMUNITY_PASSWORD}
      - hideKeyboard
      - tapOn:
          id: "sign-in-submit"
      - extendedWaitUntil:
          visible: { id: "home-hero" }
          timeout: 20000
      - tapOn: "Profile"
      - scrollUntilVisible:
          element: "Resources"
          centerElement: true
      - tapOn: "Resources"
      - tapOn: "Search resources"
      - inputText: ${STAMP}
      - hideKeyboard
      - extendedWaitUntil:
          visible: ${RESOURCE_TITLE}
          timeout: 20000
      - tapOn: "Save"
      - extendedWaitUntil:
          visible: "Saved by 1 person"
          timeout: 15000
      # The Saved list, from the Profile tab (the header's "Saved" would be ambiguous with the card's toggle).
      - tapOn: "Back"
      - scrollUntilVisible:
          element: "Saved"
          centerElement: true
      - tapOn: "Saved"
      - extendedWaitUntil:
          visible: ${RESOURCE_TITLE}
          timeout: 15000

# The centre button opens the create sheet; the backdrop, an option and the Android back button close it, and an option
# opens what it makes.
appId: ${APP_ID}
env:
  APP_ID: com.learnvianotes.dev
---
- runFlow: subflows/signed-in.yaml
- tapOn: "Create"
- assertVisible: "Quick note"
- assertVisible: "Voice note"
- assertVisible: "Flashcards"
- pressKey: Back
- assertNotVisible: "Quick note"
- assertVisible: { id: "home-hero" }
- tapOn: "Create"
- tapOn: "Quiz"
- assertNotVisible: "Quick note"
# Quiz starts a note with a quiz card (ADR-0076): no option of the sheet does nothing.
- extendedWaitUntil:
    visible: "Quiz, .*"
    timeout: 15000
- pressKey: Back
- tapOn: "Create"
- tapOn:
    point: "50%,15%"
- assertNotVisible: "Quick note"

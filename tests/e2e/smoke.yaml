# Smoke (spec §17): a signed-in learner gets past the splash to the Home tab.
# Run: pnpm test:e2e  (or: maestro test tests/e2e/smoke.yaml)
appId: ${APP_ID}
env:
  APP_ID: com.learnvianotes.dev
tags: [smoke]
---
- runFlow: subflows/signed-in.yaml
- assertVisible: "LearnViaNotes"
- assertVisible: "Keep learning, .*"
- assertVisible: "Home"
- assertVisible: "Explore"
- assertVisible: "Community"
- assertVisible: "Profile"
- assertVisible: "Create"

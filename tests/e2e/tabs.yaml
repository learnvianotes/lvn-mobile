# Bottom tabs of spec §13.1 switch screens; tabs that ship later say which phase.
appId: ${APP_ID}
env:
  APP_ID: com.learnvianotes.dev
---
- runFlow: subflows/signed-in.yaml
- tapOn: "Explore"
- assertVisible: "Search notes, people and topics"
- assertVisible: "Type to search notes and topics."
- tapOn: "Community"
- assertVisible: "Arrives in Phase 3.*"
- tapOn: "Profile"
- assertVisible: "Your account"
- assertVisible: "Ravi Kumar"
- tapOn: "Home"
- assertVisible: "Make it happen"

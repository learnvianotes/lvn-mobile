# Bottom tabs of spec §13.1 switch screens; tabs that ship later say which phase.
appId: ${APP_ID}
env:
  APP_ID: com.learnvianotes.dev
---
- runFlow: subflows/signed-in.yaml
- tapOn: "Explore"
- assertVisible: "Search notes, people, groups and topics"
- assertVisible: "Type to search notes, people and topics."
- tapOn: "Community"
- assertVisible: "Activity"
- tapOn: "Groups & classes"
- assertVisible: "Your groups"
- tapOn: "Profile"
- assertVisible: "Your account"
- assertVisible: "Ravi Kumar"
- tapOn: "Home"
- assertVisible: "Make it happen"

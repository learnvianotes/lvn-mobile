# Focus mode on the phone, end to end (P6g): a new learner starts a 15-minute focus session from Rhythm, sees the
# timer, ends it, and the server says what it counted.
appId: ${APP_ID}
env:
  APP_ID: com.learnvianotes.dev
---
- runFlow: subflows/signed-in.yaml
- tapOn: "Profile"
- scrollUntilVisible:
    element: "Rhythm"
- tapOn: "Rhythm"
- extendedWaitUntil:
    visible: "This week"
    timeout: 15000
- scrollUntilVisible:
    element: "Start focusing"
- tapOn: "15 min"
- tapOn: "Start focusing"
- extendedWaitUntil:
    visible: "Focusing: 15 minutes, then a rest."
    timeout: 15000
- assertVisible: "1[45]:\\d\\d left"
- tapOn: "End the session"
- extendedWaitUntil:
    visible: ".*minutes? counted\\."
    timeout: 15000
- scrollUntilVisible:
    element: "Rhythm buddies"
- assertVisible: "No buddies yet."

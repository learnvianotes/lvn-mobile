# The account on the phone, end to end (P3n): study details saved in Settings reach the server, and show on the
# Profile tab.
appId: ${APP_ID}
env:
  APP_ID: com.learnvianotes.dev
---
- runFlow: subflows/signed-in.yaml
- tapOn: "Profile"
# The account is in Settings, behind the Profile tab's gear (ADR-0076).
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Department"
- tapOn: "Department"
- inputText: "CSE"
- hideKeyboard
- scrollUntilVisible:
    element: "2nd year"
- tapOn: "2nd year"
- scrollUntilVisible:
    element: "Save"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Saved"
    timeout: 15000
- tapOn: "Back"
- extendedWaitUntil:
    visible: "CSE · 2nd year"
    timeout: 15000

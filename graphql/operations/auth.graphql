# Sign-in, registration and the account screen (lvn-backend users subgraph, Phase 1). The session refresh is sent
# by lib/auth/session.ts outside Apollo, so it can run while every other request waits for it.

fragment ViewerFields on User {
  id
  handle
  displayName
  email
  emailVerified
  registrationComplete
  verified
  viewerNeedsVerification
  verificationMethod
  globalRole
  teacherStatus
  restrictedMinor
  institutionalEmail
  institutionalEmailStatus
  institution {
    name
    verified
  }
  deletionScheduledFor
}

fragment SessionFields on Session {
  accessToken
  accessTokenExpiresAt
  refreshToken
  user {
    ...ViewerFields
  }
}

fragment Problems on UserError {
  field
  message
  code
}

query Viewer {
  viewer {
    ...ViewerFields
  }
}

# Lowercase dotted names this account cannot take until it is verified. Empty for a verified account and for PLATFORM_ADMIN.
query UnverifiedGatedActions {
  unverifiedGatedActions
}

# Whether Public requires a verified account (setting public_notes_require_verification).
query PublicNotesRequireVerification {
  publicNotesRequireVerification
}

query SignInOptions {
  signInOptions {
    emailPassword
    google
    emailCode
  }
  termsVersion
}

mutation SignUp($input: SignUpInput!) {
  signUp(input: $input) {
    session {
      ...SessionFields
    }
    userErrors {
      ...Problems
    }
  }
}

mutation SignIn($input: SignInInput!) {
  signIn(input: $input) {
    session {
      ...SessionFields
    }
    userErrors {
      ...Problems
    }
  }
}

mutation SignOut {
  signOut {
    ok
  }
}

mutation OAuthExchange($input: OAuthExchangeInput!) {
  oauthExchange(input: $input) {
    session {
      ...SessionFields
    }
    userErrors {
      ...Problems
    }
  }
}

mutation CompleteRegistration($input: CompleteRegistrationInput!) {
  completeRegistration(input: $input) {
    ok
    userErrors {
      ...Problems
    }
  }
}

mutation RequestPasswordReset($email: String!) {
  requestPasswordReset(input: { email: $email }) {
    ok
    userErrors {
      ...Problems
    }
  }
}

mutation VerifyInstitutionalEmail($code: String!) {
  verifyInstitutionalEmail(input: { code: $code }) {
    ok
    userErrors {
      ...Problems
    }
  }
}

mutation ResendInstitutionalEmailCode {
  resendInstitutionalEmailCode {
    ok
    userErrors {
      ...Problems
    }
  }
}

# Sign-in email link again. No arguments. Three an hour, then RATE_LIMITED with retryAfter (contracts 0.74.0).
mutation ResendVerification {
  resendVerification {
    ok
    userErrors {
      field
      message
      code
      retryAfter
    }
  }
}

# The token from the sign-in verification email. The returned user is the account after the link is accepted.
mutation VerifyEmail($token: String!) {
  verifyEmail(input: { token: $token }) {
    ok
    user {
      ...ViewerFields
    }
    userErrors {
      ...Problems
    }
  }
}

# Adds or replaces the college or organisation email and sends its code (ADR-0017).
mutation SetInstitutionalEmail($email: String!) {
  setInstitutionalEmail(input: { email: $email }) {
    ok
    userErrors {
      ...Problems
    }
  }
}

mutation SignInWithGoogle($idToken: String!) {
  signInWithGoogle(input: { idToken: $idToken }) {
    session {
      ...SessionFields
    }
    userErrors {
      ...Problems
    }
  }
}

# Account deletion (lvn-backend ADR-0088): 14 days of grace, cancellable.
mutation RequestAccountDeletion($input: RequestAccountDeletionInput!) {
  requestAccountDeletion(input: $input) {
    deletionScheduledFor
    userErrors {
      field
      message
    }
  }
}

mutation CancelAccountDeletion {
  cancelAccountDeletion {
    deletionScheduledFor
    userErrors {
      message
    }
  }
}

# Sign in with a 6-digit code emailed to the account (lvn-backend ADR-0115).
mutation RequestSignInCode($email: String!) {
  requestSignInCode(input: { email: $email }) {
    ok
    userErrors {
      ...Problems
    }
  }
}

mutation SignInWithCode($email: String!, $code: String!) {
  signInWithCode(input: { email: $email, code: $code }) {
    session {
      ...SessionFields
    }
    userErrors {
      ...Problems
    }
  }
}

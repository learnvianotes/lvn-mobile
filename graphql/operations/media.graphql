# Pictures, video, audio and files in notes on the phone (lvn-backend §8.1, ADR-0041): short-lived read URLs per card,
# and uploads straight to storage with a pre-signed PUT.

fragment PhoneMediaFields on MediaFile {
  id
  url
  expiresAt
  mimeType
  fileName
  sizeBytes
  width
  height
  durationMs
  thumbUrl
  mediumUrl
  largeUrl
  posterUrl
  playbackUrl
}

# A note's cards with their files' short-lived URLs, a page at a time: the API's pages hold at most 100 items.
query PhoneNoteMedia($id: UUID!, $after: String) {
  note(id: $id) {
    id
    cards(first: 100, after: $after) {
      edges {
        node {
          id
          content
          media {
            ...PhoneMediaFields
          }
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}

mutation CreateNoteUpload($input: CreateUploadIntentInput!) {
  createUploadIntent(input: $input) {
    intent {
      fileId
      uploadUrl
      uploadHeaders {
        name
        value
      }
    }
    userErrors {
      ...Problems
    }
  }
}

mutation CompleteNoteUpload($fileId: UUID!) {
  completeUpload(fileId: $fileId) {
    ok
    userErrors {
      ...Problems
    }
  }
}

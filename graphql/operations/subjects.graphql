# Subjects and their topics (owner, 2026-10-14: the app's own catalogue, never the old /core notes): browsed from
# Explore; a topic lists its notes in Explore.
query Subjects {
  subjects {
    id
    slug
    title
    topics {
      id
      slug
      title
      children {
        id
        slug
        title
      }
    }
  }
}

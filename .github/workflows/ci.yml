# lvn-mobile CI (spec §16.4). Builds run on GitHub Actions without an Expo account (ADR-0008).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --ci
      - name: Dependency and config health
        run: pnpm doctor
      - name: Bundle JS for Android and iOS
        run: pnpm export:check

  contract:
    # Spec §17 contract tests: the client's operations still validate and compile against the API's current schema.
    # Reads lvn-backend's exported schema until @lvn/contracts is published (lvn-backend ADR-0031); a private
    # lvn-backend needs a read-only token in the LVN_BACKEND_READ_TOKEN secret.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: learnvianotes/lvn-backend
          path: .lvn-backend
          token: ${{ secrets.LVN_BACKEND_READ_TOKEN || github.token }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm graphql:sync && pnpm codegen
        env: { LVN_SCHEMA: .lvn-backend/contracts/graphql/schema.graphql }
      - run: pnpm typecheck

  android:
    # Standalone sandbox APK for testers, on main and on demand. Signed with the debug key until store signing exists.
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: gradle }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:android sandbox
      - uses: actions/upload-artifact@v4
        with: { name: LearnViaNotes-sandbox-apk, path: dist/*.apk, retention-days: 30 }

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm audit --prod --audit-level high
